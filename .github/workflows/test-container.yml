name: Test Container

on:
  push:
    branches:
      - devel
      - master
  pull_request:
    branches:
      - devel
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Docker image
        run: |
          docker build -t esp_rgb_mock_backend:test .

      - name: Run container
        run: |
          docker run -d --name mock-backend -p 3000:3000 esp_rgb_mock_backend:test
          sleep 5

      - name: Test /app-data endpoint
        run: |
          curl --fail --silent http://localhost:3000/app-data > response.json
          cat response.json
          jq . response.json

      - name: Stop and remove container
        run: |
          docker stop mock-backend
          docker rm mock-backend

      - name: Clean up image
        run: |
          docker rmi esp_rgb_mock_backend:test
