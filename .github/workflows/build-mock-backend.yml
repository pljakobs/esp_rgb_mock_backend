# This workflow builds and pushes the esp_rgb_mock_backend image to GitHub Container Registry (ghcr.io)
# on every push to main. Adjust branches and image name as needed.

name: Build and Push Mock Backend Image

on:
  push:
    branches:
      - main
      - devel
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch, optional)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/esp_rgb_mock_backend:latest
            ghcr.io/${{ github.repository_owner }}/esp_rgb_mock_backend:${{ github.sha }}
